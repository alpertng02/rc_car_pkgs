teleop_twist_joy_node:
  ros__parameters:
    # --- DRIVE (Left Stick Up/Down) ---
    axis_linear:
      x: 1
    scale_linear:
      x: 3.0       # Normal max speed: 3.0 m/s
    scale_linear_turbo:
      x: 10.0      # Turbo max speed: 10.0 m/s
      
    # --- STEERING (Left Stick Left/Right) ---
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.523   # Exactly matches your max_steer_angle of 0.523 rad!
      
    # --- BUTTONS ---
    # 0=Cross, 1=Circle, 2=Triangle, 3=Square, 9=L1, 10=R1
    enable_button: 9        # Hold L1 to drive normally
    enable_turbo_button: 10  # Hold R1 to unlock turbo speed