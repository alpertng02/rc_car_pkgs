controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    use_sim_time: true
    reference_timeout: 2.0
    front_steering: true
    open_loop: false
    position_feedback: true
    
    # CRITICAL: If this is true, the controller expects a TwistStamped message. 
    # Setting it to false allows standard teleop_twist_keyboard to work.
    use_stamped_vel: false 
    
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    # Map all four joints directly
    rear_wheels_names:
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    front_wheels_names:
      - front_left_steer_joint
      - front_right_steer_joint
      
    # Physical dimensions pulled from your URDF
    wheelbase: 0.1688
    front_wheel_track: 0.162
    rear_wheel_track: 0.162
    front_wheels_radius: 0.03
    rear_wheels_radius: 0.03